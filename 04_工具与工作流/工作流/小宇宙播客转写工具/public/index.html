<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小宇宙播客转写工具</title>
<style>body{max-width:900px;margin:42px auto;padding:0 24px;font:15px/1.6 "Microsoft YaHei",sans-serif;color:#24292f;background:#fff}h1{margin-bottom:4px}p{color:#57606a}section{border:1px solid #d0d7de;border-radius:10px;padding:18px;margin:18px 0}input{padding:9px;border:1px solid #d0d7de;border-radius:6px;margin:4px;width:180px}button{padding:9px 13px;border:0;border-radius:6px;background:#0969da;color:#fff;cursor:pointer;margin:4px}.muted{background:#57606a}.hide{display:none}.status{font-weight:600}.card{border-top:1px solid #d8dee4;padding:12px 0}.meta{color:#57606a;font-size:13px}</style>
<body><h1>小宇宙播客转写工具</h1><p>第一阶段：发现你订阅节目中新更新、尚未处理的单集。</p>
<section id="login"><h2>登录小宇宙</h2><input id="phone" placeholder="手机号"><input id="code" placeholder="短信验证码"><br><button id="send">发送验证码</button><button id="signin">登录</button></section>
<section id="updates" class="hide"><h2>订阅更新</h2><p>点击检查后，工具会保存每一集的 ID，重复检查不会产生重复记录。自动模式每 6 小时检查一次，只自动处理启用后出现的新单集。</p><button id="check">检查新单集</button><button id="refresh" class="muted">刷新列表</button><button id="automation" class="muted">启用自动模式</button><p id="message" class="status"></p><div id="list"></div></section>
<script>
const $=s=>document.querySelector(s);let automationEnabled=false;async function api(path,method='GET',data){const r=await fetch(path,{method,headers:{'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});const j=await r.json();if(!r.ok)throw new Error(j.error||'请求失败');return j}function duration(s){const m=Math.round((s||0)/60);return m?`${Math.floor(m/60)?Math.floor(m/60)+'小时':''}${m%60}分钟`:'时长未知'}function label(s){return({new:'待处理',transcribing:'转写中',transcribed:'已入库',error:'失败'})[s]||s}function show(items=[]){$('#list').innerHTML=items.length?items.map(x=>`<div class="card"><strong>${escape(x.title)}</strong><div class="meta">${escape(x.podcast)} · ${new Date(x.published_at).toLocaleString()} · ${duration(x.duration_seconds)}</div><div class="meta">状态：${label(x.status)} ${x.error?'· '+escape(x.error):''}</div>${x.status==='new'||x.status==='error'?`<button data-eid="${escape(x.eid)}">本地转写并写入 Obsidian</button>`:''}${x.markdown_path?'<div class="meta">已写入 Obsidian 收件箱</div>':''}</div>`).join(''):'暂时没有订阅更新。'}function escape(s){const e=document.createElement('span');e.textContent=s||'';return e.innerHTML}async function load(){const r=await api('/api/updates');show(r.episodes)}function autoButton(){const b=$('#automation');b.textContent=automationEnabled?'关闭自动模式':'启用自动模式';b.className=automationEnabled?'':'muted'}async function init(){const s=await api('/api/status');automationEnabled=s.automationEnabled;autoButton();if(s.loggedIn){$('#login').classList.add('hide');$('#updates').classList.remove('hide');await load()}}$('#send').onclick=async()=>{try{await api('/api/send-code','POST',{phone:$('#phone').value.trim()});alert('验证码已发送')}catch(e){alert(e.message)}};$('#signin').onclick=async()=>{try{await api('/api/login','POST',{phone:$('#phone').value.trim(),code:$('#code').value.trim()});await init()}catch(e){alert(e.message)}};$('#check').onclick=async()=>{try{$('#message').textContent='正在检查…';const r=await api('/api/updates','POST');$('#message').textContent=`本次读取 ${r.fetched} 个更新。`;show(r.episodes)}catch(e){$('#message').textContent=e.message}};$('#refresh').onclick=load;$('#automation').onclick=async()=>{try{automationEnabled=!automationEnabled;await api('/api/automation','POST',{enabled:automationEnabled});autoButton();$('#message').textContent=automationEnabled?'自动模式已启用：只处理从现在开始出现的新单集。':'自动模式已关闭。'}catch(e){automationEnabled=!automationEnabled;$('#message').textContent=e.message}};$('#list').onclick=async e=>{const eid=e.target.dataset.eid;if(!eid)return;try{e.target.disabled=true;$('#message').textContent='已开始本地转写；可点击刷新列表查看状态。';await api('/api/transcribe/'+encodeURIComponent(eid),'POST');await load()}catch(err){$('#message').textContent=err.message;e.target.disabled=false}};init();
</script></body></html>
